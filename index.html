<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art Order</title>

    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <main class="page">

        <div class="art-circle art-circle--one"></div>
        <div class="art-circle art-circle--two"></div>
        <div class="art-line art-line--one"></div>

        <section class="order">

            <div class="order__intro">
                <span class="order__label">ART / 01</span>

                <h1 class="order__title">
                    Создай свой
                    <span>шедевр.</span>
                </h1>

                <p class="order__description">
                    Оформи заказ и следи за его путешествием
                    от первого мазка до твоего дома.
                </p>
            </div>

            <form class="order-form" id="orderForm">

                <div class="form-field">
                    <label for="name">Имя</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Твоё имя"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="product">Что заказываем?</label>

                    <select id="product" name="product" required>
                        <option value="">Выбери произведение</option>
                        <option value="dream">Сюрреалистический сон</option>
                        <option value="portrait">Авангардный портрет</option>
                        <option value="abstract">Абстрактная композиция</option>
                    </select>
                </div>

                <button class="order-form__button" type="submit">
                    Создать заказ
                    <span>↗</span>
                </button>

            </form>

        </section>

        <section class="order-status" id="orderStatus">

            <div class="status__title">
                Путь произведения
            </div>

            <div class="status__buttons">

                <button
                    class="status-button status-button--paid"
                    id="paidButton"
                    type="button"
                >
                    <span>01</span>
                    Заказ оплачен
                </button>

                <button
                    class="status-button status-button--shipped"
                    id="shippedButton"
                    type="button"
                >
                    <span>02</span>
                    Заказ отправлен
                </button>

                <button
                    class="status-button status-button--received"
                    id="receivedButton"
                    type="button"
                >
                    <span>03</span>
                    Заказ получен
                </button>

            </div>

        </section>

    </main>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="./scripts/script.js"></script>

</body>
</html>
